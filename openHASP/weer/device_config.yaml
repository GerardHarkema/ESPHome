      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[2] if fc and fc|length > 2 else None %}{% set cond = day.condition if day else '''' %}{% set icons = {''clear-night'': '''', ''cloudy'': '''', ''exceptional'': '''', ''fog'': '''', ''hail'': '''', ''lightning'': '''', ''lightning-rainy'': '''', ''partlycloudy'': '''', ''pouring'': '''', ''rainy'': '''', ''snowy'': '''', ''snowy-rainy'': '''', ''sunny'': '''', ''windy'': '''', ''windy-variant'': ''''} %}{{ icons.get(cond, icons[''cloudy'']) if day else '''' }}'

  - obj: "p1b29"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[2] if fc and fc|length > 2 else None %}{{ ((day.temperature ~ ''° / '' ~ day.templow ~ ''°'')) if day else ''--'' }}'

  - obj: "p1b22"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[3] if fc and fc|length > 3 else None %}{{ (as_timestamp(day.datetime) | timestamp_custom(''%a'', true)) if day else ''--'' }}'

  - obj: "p1b26"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[3] if fc and fc|length > 3 else None %}{% set cond = day.condition if day else '''' %}{% set icons = {''clear-night'': '''', ''cloudy'': '''', ''exceptional'': '''', ''fog'': '''', ''hail'': '''', ''lightning'': '''', ''lightning-rainy'': '''', ''partlycloudy'': '''', ''pouring'': '''', ''rainy'': '''', ''snowy'': '''', ''snowy-rainy'': '''', ''sunny'': '''', ''windy'': '''', ''windy-variant'': ''''} %}{{ icons.get(cond, icons[''cloudy'']) if day else '''' }}'

  - obj: "p1b30"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[3] if fc and fc|length > 3 else None %}{{ ((day.temperature ~ ''° / '' ~ day.templow ~ ''°'')) if day else ''--'' }}'

  - obj: "p1b23"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[4] if fc and fc|length > 4 else None %}{{ (as_timestamp(day.datetime) | timestamp_custom(''%a'', true)) if day else ''--'' }}'

  - obj: "p1b27"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[4] if fc and fc|length > 4 else None %}{% set cond = day.condition if day else '''' %}{% set icons = {''clear-night'': '''', ''cloudy'': '''', ''exceptional'': '''', ''fog'': '''', ''hail'': '''', ''lightning'': '''', ''lightning-rainy'': '''', ''partlycloudy'': '''', ''pouring'': '''', ''rainy'': '''', ''snowy'': '''', ''snowy-rainy'': '''', ''sunny'': '''', ''windy'': '''', ''windy-variant'': ''''} %}{{ icons.get(cond, icons[''cloudy'']) if day else '''' }}'

  - obj: "p1b31"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[4] if fc and fc|length > 4 else None %}{{ ((day.temperature ~ ''° / '' ~ day.templow ~ ''°'')) if day else ''--'' }}'
