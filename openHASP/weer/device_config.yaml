# Configuration for device
# Generated by openHASP Editor
#
# Include in configuration.yaml as:
#   openhasp:
#     device: !include openhasp/device_config.yaml
#
# Only widgets with a Home Assistant binding are listed below.
objects:
  #####################################
  # Page 0 — Overlay (all pages)
  #####################################
  - obj: "p0b2"  # label
    properties:
      "text": '{{ states("sensor.time") }}'

  - obj: "p0b3"  # label
    properties:
      "text": '{% set s = states("sensor.lyric_thermostaat_thermostat_binnentemperatuur") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}°'

  #####################################
  # Page 1 — Weer (KNMI)
  #####################################
  - obj: "p1b10"  # label
    properties:
      "text": '{% set cond = states(''weather.knmi'') %}{% set icons = {''clear-night'': '''', ''cloudy'': '''', ''exceptional'': '''', ''fog'': '''', ''hail'': '''', ''lightning'': '''', ''lightning-rainy'': '''', ''partlycloudy'': '''', ''pouring'': '''', ''rainy'': '''', ''snowy'': '''', ''snowy-rainy'': '''', ''sunny'': '''', ''windy'': '''', ''windy-variant'': ''''} %}{{ icons.get(cond, icons[''cloudy'']) }}'

  - obj: "p1b11"  # label
    properties:
      "text": '{% set t = state_attr(''weather.knmi'', ''temperature'') %}{{ (t ~ ''°'') if t is not none else ''--°'' }}'

  - obj: "p1b12"  # label
    properties:
      "text": '{% set cond = states(''weather.knmi'') %}{% set names = {''clear-night'': ''Helder'', ''cloudy'': ''Bewolkt'', ''exceptional'': ''Uitzonderlijk'', ''fog'': ''Mist'', ''hail'': ''Hagel'', ''lightning'': ''Onweer'', ''lightning-rainy'': ''Onweer met regen'', ''partlycloudy'': ''Half bewolkt'', ''pouring'': ''Zware regen'', ''rainy'': ''Regen'', ''snowy'': ''Sneeuw'', ''snowy-rainy'': ''Natte sneeuw'', ''sunny'': ''Zonnig'', ''windy'': ''Winderig'', ''windy-variant'': ''Winderig''} %}{{ names.get(cond, cond) }}'

  - obj: "p1b13"  # label
    properties:
      "text": '{% set h = state_attr(''weather.knmi'', ''humidity'') %}Vocht: {{ h if h is not none else ''--'' }}%'

  - obj: "p1b14"  # label
    properties:
      "text": '{% set ws = state_attr(''weather.knmi'', ''wind_speed'') %}{% set wb = state_attr(''weather.knmi'', ''wind_bearing'') %}{% set dirs = [''N'',''NNE'',''NE'',''ENE'',''E'',''ESE'',''SE'',''SSE'',''S'',''SSW'',''SW'',''WSW'',''W'',''WNW'',''NW'',''NNW''] %}{% set idx = (((wb / 22.5) + 0.5) | int % 16) if wb is not none else None %}Wind: {{ ws if ws is not none else ''--'' }} km/h {{ dirs[idx] if idx is not none else '''' }}'

  - obj: "p1b15"  # label
    properties:
      "text": '{% set p = state_attr(''weather.knmi'', ''pressure'') %}Druk: {{ p if p is not none else ''--'' }} hPa'

  - obj: "p1b20"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[1] if fc and fc|length > 1 else None %}{{ (as_timestamp(day.datetime) | timestamp_custom(''%a'', true)) if day else ''--'' }}'

  - obj: "p1b24"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[1] if fc and fc|length > 1 else None %}{% set cond = day.condition if day else '''' %}{% set icons = {''clear-night'': '''', ''cloudy'': '''', ''exceptional'': '''', ''fog'': '''', ''hail'': '''', ''lightning'': '''', ''lightning-rainy'': '''', ''partlycloudy'': '''', ''pouring'': '''', ''rainy'': '''', ''snowy'': '''', ''snowy-rainy'': '''', ''sunny'': '''', ''windy'': '''', ''windy-variant'': ''''} %}{{ icons.get(cond, icons[''cloudy'']) if day else '''' }}'

  - obj: "p1b28"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[1] if fc and fc|length > 1 else None %}{{ ((day.temperature ~ ''° / '' ~ day.templow ~ ''°'')) if day else ''--'' }}'

  - obj: "p1b21"  # label
    properties:
      "text": '{% set fc = state_attr(''weather.knmi'', ''forecast'') %}{% set day = fc[2] if fc and fc|length > 2 else None %}{{ (as_timestamp(day.datetime) | timestamp_custom(''%a'', true)) if day else ''--'' }}'

  - obj: "p1b25"  # label
