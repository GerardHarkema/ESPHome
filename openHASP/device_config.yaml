# Configuration for device
# Generated by openHASP Editor
#
# Include in configuration.yaml as:
#   openhasp:
#     device: !include openhasp/device_config.yaml
#
# Only widgets with a Home Assistant binding are listed below.
objects:
  #####################################
  # Page 0 — Overlay (all pages)
  #####################################
  - obj: "p0b2"  # label
    properties:
      "text": '{{ states("sensor.time") }}'

  - obj: "p0b3"  # label
    properties:
      "text": '{% set s = states("sensor.lyric_thermostaat_thermostat_binnentemperatuur") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}°'

  #####################################
  # Page 1 —  Page 1 
  #####################################
  - obj: "p1b10"  # label
    properties:
      "text": '{{ states("sensor.meterkast_inverter_solar_enery_daily") | float(0) }}kWh'

  - obj: "p1b11"  # label
    properties:
      "text": '{% set s = states("sensor.net_import_energy_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p1b12"  # label
    properties:
      "text": '{% set s = states("sensor.net_export_energy_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p1b13"  # label
    properties:
      "text": '{% set s = states("sensor.home_energy") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p1b14"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_grid_energy_import_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}Kwh'

  - obj: "p1b15"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_grid_energy_export_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p1b49"  # gauge
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_ct_total_power") | float(0) }}'

  - obj: "p1b52"  # label
    properties:
      "text": '{{ states("sensor.omnik_solar_current_power") | float(0) }}W'
      "text_color": '{{ ''blue'' if states(''sensor.omnik_solar_current_power'') | float(0) >= 0 else ''red'' }}'

  - obj: "p1b53"  # label
    properties:
      "text": '{{ states("sensor.marstek_venuse_3_0_ct_total_power") | float(0) }}W'
      "text_color": '{{ ''red'' if states(''sensor.marstek_venuse_3_0_ct_total_power'') | float(0) < 0 else ''blue'' }}'

  - obj: "p1b54"  # arc
    properties:
      "val": '{{ states("sensor.omnik_solar_current_power") | float(0) | abs }}'
      "line_color10": '{{ ''blue'' if states(''sensor.omnik_solar_current_power'') | float(0) >= 0 else ''red'' }}'

  #####################################
  # Page 2 —  Page 2 
  #####################################
  - obj: "p2b1"  # arc
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_ct_phase_a_power") | float(0) | abs }}'
      "line_color10": '{{ ''red'' if states(''sensor.marstek_venuse_3_0_ct_phase_a_power'') | float(0) >= 0 else ''blue'' }}'

  - obj: "p2b3"  # label
    properties:
      "text": '{{ states("sensor.marstek_venuse_3_0_ct_phase_a_power") | float(0) }}kW'

  - obj: "p2b4"  # arc
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_ct_phase_b_power") | float(0) | abs }}'
      "line_color10": '{{ ''red'' if states(''sensor.marstek_venuse_3_0_ct_phase_b_power'') | float(0) >= 0 else ''blue'' }}'

  - obj: "p2b6"  # label
    properties:
      "text": '{{ states("sensor.marstek_venuse_3_0_ct_phase_b_power") | float(0) }}kW'

  - obj: "p2b7"  # arc
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_ct_phase_c_power") | float(0) | abs }}'
      "line_color10": '{{ ''red'' if states(''sensor.marstek_venuse_3_0_ct_phase_c_power'') | float(0) >= 0 else ''blue'' }}'

  - obj: "p2b9"  # label
    properties:
      "text": '{{ states("sensor.marstek_venuse_3_0_ct_phase_c_power") | float(0) }}kW'

  - obj: "p2b10"  # arc
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_ct_total_power") | float(0) | abs }}'
      "line_color10": '{{ ''red'' if states(''sensor.marstek_venuse_3_0_ct_total_power'') | float(0) >= 0 else ''blue'' }}'

  - obj: "p2b12"  # label
    properties:
      "text": '{{ states("sensor.marstek_venuse_3_0_ct_total_power") | float(0) }}kW'

  #####################################
  # Page 3 — Page 3
  #####################################
  - obj: "p3b2"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_venuse_3_0_state_of_charge") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}%'

  - obj: "p3b3"  # gauge
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_grid_power") | float(0) }}'

  - obj: "p3b4"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_venuse_3_0_grid_power") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}W'

  - obj: "p3b5"  # label
    properties:
      "text": '{% set soc = states(''sensor.marstek_venuse_3_0_state_of_charge'') | float(0) %}{% if soc < 25 %}{% elif soc < 50 %}{% elif soc < 75 %}{% else %}{% endif %}'
      "text_color": '{% set soc = states(''sensor.marstek_venuse_3_0_state_of_charge'') | float(0) %}{% if soc < 20 %}red{% elif soc < 40 %}orange{% elif soc < 60 %}yellow{% else %}#67dc18{% endif %}'

  - obj: "p3b8"  # arc
    properties:
      "val": '{{ states("sensor.marstek_venuse_3_0_state_of_charge") | float(0) | abs }}'

  - obj: "p3b9"  # label
    properties:
      "text": '{% set soc = states(''sensor.marstek_venuse_3_0_state_of_charge'') | float(0) %}{% if soc < 25 %}{% elif soc < 50 %}{% elif soc < 75 %}{% else %}{% endif %}'
      "text_color": '{% set soc = states(''sensor.marstek_venuse_3_0_state_of_charge'') | float(0) %}{% if soc < 20 %}red{% elif soc < 40 %}orange{% elif soc < 60 %}yellow{% else %}#67dc18{% endif %}'

  #####################################
  # Page 4 —  Page 4 
  #####################################
  - obj: "p4b2"  # label
    properties:
      "text": '{% set s = states("sensor.meterkast_inverter_solar_enery_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b4"  # label
    properties:
      "text": '{{ states("sensor.net_import_energy_daily") }}'

  - obj: "p4b5"  # label
    properties:
      "text": '{% set s = states("sensor.net_export_energy_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b7"  # label
    properties:
      "text": '{% set s = states("sensor.home_energy") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b9"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_grid_energy_import_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b10"  # label
    properties:
      "text": '{% set s = states("sensor.marstek_grid_energy_export_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b15"  # label
    properties:
      "text": '{% set s = states("sensor.net_import_energy_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}kWh'

  - obj: "p4b17"  # label
    properties:
      "text": '{% set s = states("sensor.meterkast_muino_water_meter_e5b230_water_daily") %}{{ s if s not in [''unavailable'',''unknown''] else ''--'' }}l'

